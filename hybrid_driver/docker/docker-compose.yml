version: '3.8'

services:
  #==================
  # SpotLight API 服务
  #==================
  spotlight-api:
    build:
      context: ../../
      dockerfile: hybrid_driver/docker/Dockerfile
    container_name: spotlight-api
    ports:
      - "10001:10001"
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=10001
      - LOG_LEVEL=INFO
      - API_RELOAD=false
      # 时区设置
      - TZ=Asia/Shanghai
    restart: unless-stopped
    command: ["python", "hybrid_driver/start_api_server.py", "--host", "0.0.0.0", "--port", "10001", "--no-reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s