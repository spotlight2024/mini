version: '3.8'

services:
  #==================
  # SpotLight API 服务
  #==================
  spotlight-api:
    build:
      context: ../../
      dockerfile: hybrid_driver/docker/Dockerfile
    container_name: spotlight-api
    ports:
      - "10001:10001"
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=10001
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s