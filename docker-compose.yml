version: '3.8'
services:
  # SpotLight API服务
  spotlight-api:
    build:
      context: .
      dockerfile: Dockerfile.spotlight
    container_name: spotlight-api
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
      - SELENIUM_HUB_URL=http://selenium-hub:4444
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo:27017/spotlight
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - selenium-hub
      - redis
      - mongo
    networks:
      - spotlight-network
    restart: unless-stopped

  # Selenium Hub
  selenium-hub:
    image: selenium/hub:4.33.0-20250606
    container_name: selenium-hub
    ports:
      - "4442:4442"  # Event Bus Publish
      - "4443:4443"  # Event Bus Subscribe  
      - "4444:4444"  # Hub HTTP
    networks:
      - spotlight-network
    restart: unless-stopped

  # Selenium Chrome节点 - 支持自动扩容
  selenium-node-chrome:
    image: selenium/node-chrome:4.33.0-20250606
    container_name: selenium-node-chrome
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_REGISTER_CYCLE=10000
      - SE_NODE_REGISTER_PERIOD=10000
      - SE_NODE_HOST=selenium-node-chrome
      - SE_NODE_PORT=5555
    volumes:
      - /dev/shm:/dev/shm  # 共享内存优化
    depends_on:
      - selenium-hub
    networks:
      - spotlight-network
    restart: unless-stopped
    deploy:
      replicas: 2  # 初始副本数
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # 基础设施服务
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - spotlight-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - spotlight-network
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:

networks:
  spotlight-network:
    driver: bridge 