services:
  spotlight-api:
    build:
      context: .
      dockerfile: Dockerfile.spotlight
    container_name: spotlight-api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-10001}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "${API_PORT:-10001}:${API_PORT:-10001}"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-10001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

    # 可选：本地临时调试需要直连 USB/ADB 时启用（生产环境请勿开启）
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb


