version: '3.8'

services:
  spotlight-api:
    build:
      context: .
      dockerfile: Dockerfile.spotlight
      args:
        - VERSION=${IMAGE_TAG:-latest}
        - BUILD_DATE=${BUILD_DATE:-}
        - GIT_COMMIT=${GIT_COMMIT:-}
    image: ${IMAGE_NAME:-spotlight-api}:${IMAGE_TAG:-latest}
    container_name: spotlight-api
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-10001}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONPATH=/app
    ports:
      - "${API_PORT:-10001}:${API_PORT:-10001}"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-10001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - spotlight-network

    # 可选：本地临时调试需要直连 USB/ADB 时启用（生产环境请勿开启）
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

networks:
  spotlight-network:
    name: spotlight-network
    driver: bridge


