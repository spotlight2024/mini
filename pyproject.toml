[tool.poetry]
name = "spotlight-hybrid-driver"
version = "0.1.0"
description = "SpotLight hybrid driver automation services"
readme = "README.md"
authors = ["SpotLight Team <dev@spotlight.local>"]
packages = [{ include = "hybrid_driver" }]

[[tool.poetry.source]]
name = "aliyun"
url = "http://mirrors.cloud.aliyuncs.com/pypi/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "0.115.12"
uvicorn = "0.34.2"
selenium = "4.33.0"
pydantic = "2.11.5"
webdriver-manager = "4.0.2"
adbutils = "~2.9.2"
requests = "2.32.3"
starlette = "0.46.2"
appium-python-client = "~5.1.1"
loguru = "0.7.2"
websockets = ">=10.0,<13.0"
httpx = ">=0.23.0,<1.0.0"
python-multipart = ">=0.0.5"
python-jose = { version = "3.3.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
python-dotenv = "1.1.0"
aiofiles = ">=0.7.0"
aiohttp = ">=3.8.0,<4.0.0"
netifaces = ">=0.11.0"
RestrictedPython = ">=6.0"
stealthenium = "1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pytest-asyncio = "0.16.0"

[tool.poetry.scripts]
spotlight-api = "hybrid_driver.start_api_server:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
