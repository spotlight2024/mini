# 开发环境 Docker Compose 配置
# 用于本地快速调试，代码修改后无需重新构建镜像
version: '3.8'

services:
  spotlight-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.spotlight
      args:
        - VERSION=dev
        - BUILD_DATE=${BUILD_DATE:-}
        - GIT_COMMIT=${GIT_COMMIT:-}
    image: ${IMAGE_NAME:-spotlight-api}:dev
    container_name: spotlight-api-dev
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-10001}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    ports:
      - "${API_PORT:-10001}:${API_PORT:-10001}"
    volumes:
      # 挂载代码目录，支持实时修改
      - ./hybrid_driver:/app/hybrid_driver
      - ./requirements:/app/requirements
      - ./config:/app/config
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
      # 开发工具目录
      - ./scripts:/app/scripts
      - ./.env:/app/.env:ro
      # 排除不需要挂载的目录
      - /app/venv
      - /app/.git
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-10001}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - spotlight-dev-network
    # 开发模式：支持代码热重载
    command: ["sh", "-c", "uvicorn hybrid_driver.server_optimized:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-10001} --log-level ${LOG_LEVEL:-debug} --reload --reload-dir /app/hybrid_driver"]
    
    # 可选：本地调试需要直连 USB/ADB 时启用
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

networks:
  spotlight-dev-network:
    name: spotlight-dev-network
    driver: bridge
