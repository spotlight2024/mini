# 开发环境 Docker Compose 配置
# 用于本地快速调试，代码修改后无需重新构建镜像

services:
  spotlight-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.spotlight
    container_name: spotlight-api-dev
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-10001}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    ports:
      - "${API_PORT:-10001}:${API_PORT:-10001}"
    volumes:
      # 挂载代码目录，支持实时修改
      - ./hybrid_driver:/app/hybrid_driver
      - ./requirements:/app/requirements
      - ./config:/app/config
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
      # 开发工具目录
      - ./scripts:/app/scripts
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT:-10001}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # 开发模式：支持代码热重载
    command: ["sh", "-c", "uvicorn hybrid_driver.server_optimized:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-10001} --log-level ${LOG_LEVEL:-debug} --reload --reload-dir /app/hybrid_driver"]
    
    # 可选：本地调试需要直连 USB/ADB 时启用
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
