services:
  # SpotLight API服务
  spotlight-api:
    image: spotlight/api:latest
    container_name: spotlight-api
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - spotlight-network

networks:
  spotlight-network:
    driver: bridge 