version: '3.8'

services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_NODE_MAX_SESSIONS=2
    networks:
      - selenium-grid
    restart: unless-stopped

  chrome-node-6:
    image: chrome-tinyproxy-node:latest
    container_name: chrome-node-6
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_NODE_DELETE_SESSION_ON_UI=true
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      # VNC配置
      - SE_VNC_NO_PASSWORD=true
      - SE_NOVNC_NO_PASSWORD=true
      # 上游代理配置 - 节点1
      - PROXY_HOST=183.162.239.238
      - PROXY_PORT=64021
      - PROXY_USERNAME=2hi9ub
      - PROXY_PASSWORD=6yy47euj
      # HTTP代理环境变量 (让Chrome透明使用tinyproxy)
      - HTTP_PROXY=http://127.0.0.1:8888
      - HTTPS_PROXY=http://127.0.0.1:8888
      - http_proxy=http://127.0.0.1:8888
      - https_proxy=http://127.0.0.1:8888
      # 增加会话超时时间防止崩溃
      - SE_NODE_SESSION_TIMEOUT=600
      - SE_SESSION_REQUEST_TIMEOUT=600
    volumes:
      # 直接挂载服务器目录，Chrome数据直接读写到服务器
      - /root/workspace/chrome_data:/opt/chrome_user_data:rw
    networks:
      - selenium-grid
    shm_size: 2gb
    restart: unless-stopped
    # 增加资源限制以支持Chrome 138
    mem_limit: 2gb
    cpus: 2.0

networks:
  selenium-grid:
    driver: bridge