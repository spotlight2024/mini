services:

  spotlight-api:
    image: docker-spotlight-api:latest
    container_name: spotlight-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - selenium-hub
    networks:
      - selenium-grid
    volumes:
      - ../hybrid_driver:/app/hybrid_driver

  #==================
  # Selenium Hub
  #==================
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      # - SE_LOG_LEVEL=DEBUG
      - SE_NODE_SESSION_TIMEOUT=15
      - SE_SESSION_REQUEST_TIMEOUT=15
      - SE_ENABLE_TRACING=true
      - SE_LOG_LEVEL=ALL
    # volumes:
    #   # 挂载Hub配置文件
    #   - ./config/grid-config.toml:/opt/selenium/config.toml:ro
    networks:
      - selenium-grid

  chrome-driver:
    image: custom-selenium-chrome:adb_proxy
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_LOG_LEVEL=ALL
      - ADB_PROXY_LOG_LEVEL=DEBUG
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true  
    networks:
      - selenium-grid

  #==================
  # Node-Docker (直接使用宿主机Docker)
