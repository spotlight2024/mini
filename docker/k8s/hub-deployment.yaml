apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-hub
  namespace: selenium-grid
  labels:
    app: selenium-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: selenium-hub
  template:
    metadata:
      labels:
        app: selenium-hub
    spec:
      # hostNetwork: true  # 移除 hostNetwork 以避免网络连接问题
      # nodeSelector:
      #   kubernetes.io/hostname: selenium-cluster-control-plane
      containers:
      - name: selenium-hub
        image: selenium/hub:4.38.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4444
          name: hub
        - containerPort: 4442
          name: event-bus-pub
        - containerPort: 4443
          name: event-bus-sub
        - containerPort: 5557
          name: metrics
        envFrom:
        - configMapRef:
            name: selenium-observability
        env:
        - name: SE_NODE_SESSION_TIMEOUT
          value: "300"
        - name: SE_SESSION_REQUEST_TIMEOUT
          value: "300"
        - name: SE_NODE_OVERRIDE_MAX_SESSIONS
          value: "true"
        - name: SE_SESSION_QUEUE_TIMEOUT
          value: "300"
        - name: SE_NEW_SESSION_THREAD_POOL_SIZE
          value: "200"
        - name: SE_ENABLE_PROMETHEUS_ENDPOINT
          value: "true"
        - name: SE_PROMETHEUS_PORT
          value: "5557"
        - name: SE_HEALTHCHECK_INTERVAL
          value: "5"
        - name: SE_OPTS
          value: "--max-threads 200"
        resources:
          requests:
            cpu: "2000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
