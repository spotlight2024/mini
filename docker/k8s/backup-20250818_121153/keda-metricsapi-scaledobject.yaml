apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: chrome-node-autoscale-metrics
  namespace: selenium-grid
spec:
  scaleTargetRef:
    name: chrome-node
  pollingInterval: 2        # 从 3 秒减少到 2 秒，进一步提升响应速度
  cooldownPeriod: 30       # 从 60 秒减少到 30 秒，进一步减少冷却时间
  minReplicaCount: 8       # 从 6 增加到 8，与 deployment 保持一致
  maxReplicaCount: 100
  triggers:
  - type: metrics-api
    metadata:
      targetValue: "1"
      url: "http://grid-metrics-exporter.selenium-grid.svc.cluster.local:8080/value"
      valueLocation: "value"


