loki:
  fullnameOverride: loki
  image:
    tag: 2.9.3
  persistence:
    enabled: false
  auth_enabled: false
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_block_size: 262144
      chunk_retain_period: 1m
      max_transfer_retries: 0
    schema_config:
      configs:
        - from: 2020-10-15
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/cache
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    chunk_store_config:
      max_look_back_period: 168h
    table_manager:
      retention_deletes_enabled: false
      retention_period: 0
  service:
    type: ClusterIP

promtail:
  enabled: true
  image:
    tag: 2.9.3
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
  extraScrapeConfigs: []
  pipelineStages: []
  extraVolumes: []
  extraVolumeMounts: []

fluent-bit:
  enabled: false

filebeat:
  enabled: false

logstash:
  enabled: false

prometheus:
  enabled: false

kube-state-metrics:
  enabled: false

serviceAccount:
  create: true
