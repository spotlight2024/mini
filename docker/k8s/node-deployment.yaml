apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome-node
  namespace: selenium-grid
  labels:
    app: chrome-node
spec:
  replicas: 1  # 从 6 增加到 8，基于新的资源设置
  selector:
    matchLabels:
      app: chrome-node
  template:
    metadata:
      labels:
        app: chrome-node
    spec:
      securityContext:
        fsGroup: 1201
      terminationGracePeriodSeconds: 30  # 优雅关闭时间
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      containers:
      - name: chrome-node
        image: chrome-tinyproxy-node:1.0.8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5555
          name: node
        - containerPort: 5900
          name: vnc
        - containerPort: 7900
          name: novnc
        env:
        - name: SE_EVENT_BUS_HOST
          value: selenium-hub
        - name: SE_EVENT_BUS_PUBLISH_PORT
          value: "4442"
        - name: SE_EVENT_BUS_SUBSCRIBE_PORT
          value: "4443"
        - name: SE_NODE_DELETE_SESSION_ON_UI
          value: "true"
        - name: SE_NODE_MAX_SESSIONS
          value: "1"
        - name: SE_NODE_OVERRIDE_MAX_SESSIONS
          value: "true"
        - name: SE_VNC_NO_PASSWORD
          value: "true"
        - name: SE_NOVNC_NO_PASSWORD
          value: "true"
        # 透明代理配置 - 使用容器内 tinyproxy
        - name: PROXY_HOST
          value: "192.168.1.46"
        - name: PROXY_PORT
          value: "7897"
        # - name: PROXY_USERNAME
        #   value: "vgmpgv"
        # - name: PROXY_PASSWORD
        #   value: "1bk79g9y"
        - name: HTTP_PROXY
          value: "http://127.0.0.1:8888"
        - name: HTTPS_PROXY
          value: "http://127.0.0.1:8888"
        - name: http_proxy
          value: "http://127.0.0.1:8888"
        - name: https_proxy
          value: "http://127.0.0.1:8888"
        - name: SE_NODE_SESSION_TIMEOUT
          value: "600"
        - name: SE_SESSION_REQUEST_TIMEOUT
          value: "600"
        resources:
          requests:
            cpu: "600m"           # CPU请求资源
            memory: "800Mi"       # 内存请求资源
          limits:
            cpu: "1000m"          # 1核CPU限制
            memory: "1.5Gi"       # 内存限制
        volumeMounts:
        - name: chrome-nas
          mountPath: /opt/chrome_user_data
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: chrome-nas
        persistentVolumeClaim:
          claimName: chrome-nas-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"

