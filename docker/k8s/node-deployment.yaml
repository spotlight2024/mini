apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome-node
  namespace: selenium-grid
  labels:
    app: chrome-node
spec:
  replicas: 4   # 单个高配置节点
  selector:
    matchLabels:
      app: chrome-node
  template:
    metadata:
      labels:
        app: chrome-node
    spec:
      securityContext:
        fsGroup: 1201
      terminationGracePeriodSeconds: 30  # 优雅关闭时间
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      containers:
      - name: chrome-node
        image: chrome-tinyproxy-node:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5555
          name: node
        - containerPort: 5900
          name: vnc
        - containerPort: 7900
          name: novnc
        env:
        - name: SE_EVENT_BUS_HOST
          value: selenium-hub
        - name: SE_EVENT_BUS_PUBLISH_PORT
          value: "4442"
        - name: SE_EVENT_BUS_SUBSCRIBE_PORT
          value: "4443"
        - name: SE_NODE_DELETE_SESSION_ON_UI
          value: "true"
        - name: SE_NODE_MAX_SESSIONS
          value: "1"
        - name: SE_NODE_OVERRIDE_MAX_SESSIONS
          value: "true"
        - name: SE_VNC_NO_PASSWORD
          value: "true"
        - name: SE_NOVNC_NO_PASSWORD
          value: "true"
        # 代理配置 - 指向tinyproxy sidecar (端口3128避免与chrome-node内tinyproxy冲突)
        - name: HTTP_PROXY
          value: "http://127.0.0.1:3128"
        - name: HTTPS_PROXY
          value: "http://127.0.0.1:3128"
        - name: http_proxy
          value: "http://127.0.0.1:3128"
        - name: https_proxy
          value: "http://127.0.0.1:3128"
        - name: SE_NODE_SESSION_TIMEOUT
          value: "600"
        - name: SE_SESSION_REQUEST_TIMEOUT
          value: "600"
        resources:
          requests:
            cpu: "500m"         # 4C8G服务器，8个节点，每个节点100m CPU
            memory: "500Mi"     # 每个节点500Mi内存
          limits:
            cpu: "1000m"        # 每个节点最大1000m CPU
            memory: "1Gi"       # 每个节点最大2Gi内存
        volumeMounts:
        - name: proxy-config
          mountPath: /shared/config
        - name: shared-scripts
          mountPath: /shared/scripts
        - name: chrome-nas
          mountPath: /opt/chrome_user_data
        - name: dshm
          mountPath: /dev/shm
          
      # tinyproxy Sidecar容器 - 高性能代理服务
      - name: proxy-sidecar
        image: vimagick/tinyproxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3128
          name: proxy
        # env:
        # - name: DEFAULT_PROXY_HOST
        #   value: "61.132.231.167"
        # - name: DEFAULT_PROXY_PORT
        #   value: "62008"
        # - name: DEFAULT_PROXY_USERNAME
        #   value: "vgmpgv"
        # - name: DEFAULT_PROXY_PASSWORD
        #   value: "1bk79g9y"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: proxy-config
          mountPath: /shared/config
        - name: shared-scripts
          mountPath: /shared/scripts
          readOnly: true
        # 使用chrome-node容器中的脚本
        command: ["/bin/sh", "/shared/scripts/tinyproxy-sidecar.sh"]
      volumes:
      - name: proxy-config
        emptyDir: {}
      - name: shared-scripts
        emptyDir: {}  # 用于共享脚本文件
      - name: chrome-nas
        persistentVolumeClaim:
          claimName: chrome-nas-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "512Mi"  # 增加共享内存以支持Chrome运行
