apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-metrics-exporter
  namespace: selenium-grid
data:
  exporter.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib import request

    HUB_URL = os.getenv("HUB_URL", "http://selenium-hub:4444")
    BUFFER = int(os.getenv("BUFFER", "2"))

    def fetch_active_sessions():
        url = f"{HUB_URL}/graphql"
        body = json.dumps({
            "query": "{ grid { sessionCount } }"
        }).encode("utf-8")
        req = request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
        with request.urlopen(req, timeout=5) as resp:
            data = json.loads(resp.read().decode("utf-8"))
            return int(data["data"]["grid"]["sessionCount"])

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/value"):
                try:
                    active = fetch_active_sessions()
                    desired = max(active + BUFFER, BUFFER)
                    payload = {"value": desired}
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps(payload).encode("utf-8"))
                except Exception as e:
                    self.send_response(500)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": str(e)}).encode("utf-8"))
            else:
                self.send_response(404)
                self.end_headers()

    if __name__ == "__main__":
        port = int(os.getenv("PORT", "8080"))
        server = HTTPServer(("0.0.0.0", port), Handler)
        server.serve_forever()


